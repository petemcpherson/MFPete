name: Release

# Push a tag like v1.0.0 to build, notarize, and publish a release.
#
# Required repository secrets:
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password for that .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER              App Store Connect issuer ID
#   SPARKLE_PRIVATE_KEY        Sparkle EdDSA private key (from `generate_keys -x`)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Releases are cut locally (docs/RELEASING.md) until the secrets above exist.
  # Without them, this skips instead of failing.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
        run: echo "ready=$([ -n "$P12" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.sh uses the commit count as the build number

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, notarize, and package
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          scripts/release.sh

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/make-appcast.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat build/release/VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            --title "MFPete $VERSION" \
            --generate-notes \
            "build/release/MFPete-$VERSION.dmg" \
            "build/release/MFPete-$VERSION.zip" \
            "build/release/appcast.xml"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
